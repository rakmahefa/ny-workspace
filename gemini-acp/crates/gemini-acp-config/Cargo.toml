[package]
name = "gemini-acp-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Fondation ACP : config, core Gemini, client web, proxy web2api"

[[bin]]
name = "gemini-web2api"
path = "src/web2api/main.rs"

[dependencies]
# Ex-dépendances de gemini-core
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Ex-dépendances de gemini-client (réseau)
reqwest = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Ex-dépendances de gemini-web2api (serveur HTTP)
axum = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

# Config ACP
agent-client-protocol = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
