[workspace]
resolver = "2"
members = ["crates/gemini-acp-config", "crates/gemini-acp-runtime", "crates/gemini-acp-agent"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/rakmahefa/ny-workspace"
homepage = "https://github.com/rakmahefa/ny-workspace"
authors = ["gemini-acp contributors"]
rust-version = "1.82"

[workspace.metadata]
keywords = ["ai", "agent", "acp", "zed", "gemini"]
categories = ["development-tools", "api-bindings"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
regex = "1"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
agent-client-protocol = "2"
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
notify = "8"

[profile.release]
lto = true
strip = true
